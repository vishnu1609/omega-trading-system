broker:
  name: "dhan"
  client_id: "${DHAN_CLIENT_ID}"
  access_token: "${DHAN_ACCESS_TOKEN}"

risk:
  max_daily_loss: 10000         # 10% of 1L — paper mode: let it rip to stress-test
  max_concurrent_positions: 6   # paper mode: allow more concurrent to stress-test
  max_daily_trades: 20          # paper mode: higher limit to gather ML data faster
  sl_buffer_pct: 0.3
  trail_pct: 0.15
  cooldown_after_losses: 3      # cooldown after 3 consecutive losses
  cooldown_minutes: 15          # 15 min cooldown to let market settle
  margin_buffer_pct: 10         # keep 10% buffer for safety

session:
  start_time: "09:16"           # 1 min after open to skip auction noise
  end_time: "15:10"             # square-off 5 min before broker RMS kicks in
  square_off_time: "15:10"      # beat Dhan's 15:15 auto-square-off (DH-906)

category_toggle:
  allow_index_futures_live: false # Index Futures disabled in live mode

strategy:
  name: "omega_complete"
  mode: "paper"                 # "paper" or "live" — start paper always
  default_qty_lots: 1           # conservative: 1 lot per trade, scale up on winners

webhook:
  host: "0.0.0.0"
  port: 8000
  secret: "${TV_WEBHOOK_SECRET}"

imessage:
  enabled: true
  recipient: "tvishnuteja16@gmail.com"

telegram:
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

signal_generator:
  watch: ["NIFTY", "BANKNIFTY", "SENSEX"]
  poll_interval: 30               # seconds between scans (30s balances signal freshness vs API rate limits)
  signal_cooldown_sec: 120        # paper mode: 2 min cooldown — faster signal cycling
  st_period: 10                   # SuperTrend period
  st_mult: 3.0                   # SuperTrend multiplier
  adx_len: 14                    # ADX length
  adx_threshold: 20              # min ADX for entry (lowered — Yahoo vol=0 skews ADX)
  chand_len: 22                  # Chandelier Exit length
  chand_mult: 3.0                # Chandelier multiplier
  rsi_period: 14                  # RSI period for momentum
  rsi_overbought: 70.0            # RSI overbought level — blocks BUY above this
  rsi_oversold: 30.0              # RSI oversold level — blocks SELL below this
  bb_period: 20                   # Bollinger Bands period
  bb_std: 2.0                    # Bollinger Bands standard deviation
  ema_fast: 9                    # Fast EMA for crossover
  ema_slow: 21                   # Slow EMA for crossover
  chop_period: 14                 # Choppiness Index period
  chop_threshold: 61.8            # Above this = choppy market, signals suppressed
  orb_minutes: 30                 # Opening Range Breakout window (9:15 + 30 min = 9:45)

guardrails:
  capital: 100000                   # 1 lakh capital
  max_risk_per_trade_pct: 10.0        # paper mode: 10% = ₹10K per trade — room for BANKNIFTY multi-lot
  nse_allocation_cap: 0.90          # paper mode: 90% allocation to NSE indices
  adx_min_threshold: 10             # suppress signals if ADX < 10 (truly dead market — 14 was blocking valid options moves)
  vwap_warmup_time: "09:30"         # wait for 3 candles before trusting VWAP
  candle_max_staleness_sec: 330     # reject signal if candle > 5.5 min old
  expiry_day_cutoff: "12:30"        # block new 0-DTE option entries after 12:30
  step_trail_breakeven_pct: 0.15    # move SL to breakeven at +0.15% profit (~₹35 NIFTY)
  step_trail_lock_pct: 0.30         # lock in 0.15% profit at +0.30% gain (~₹70 NIFTY)
  step_trail_tight_pct: 0.50        # active trailing at +0.50% gain (~₹117 NIFTY)

logging:
  level: "INFO"
  file: "logs/omega.log"
