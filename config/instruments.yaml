## ── COST MODELS ──────────────────────────────────────────────────────────

costs:
  equity_options:
    brokerage_per_order: 20
    stt_sell_pct: 0.0625        # STT on sell side (options)
    exchange_txn_pct: 0.053
    sebi_per_crore: 10
    gst_pct: 18
    stamp_duty_pct: 0.003
    slippage_ticks: 2

  equity_futures:
    brokerage_per_order: 20
    stt_pct: 0.0125             # STT on both sides (futures)
    exchange_txn_pct: 0.002
    sebi_per_crore: 10
    gst_pct: 18
    stamp_duty_pct: 0.002
    slippage_ticks: 1

  commodity_futures:
    brokerage_per_order: 20
    ctt_sell_pct: 0.01          # CTT on sell side (commodity)
    exchange_txn_pct: 0.003
    sebi_per_crore: 10
    gst_pct: 18
    stamp_duty_pct: 0.002
    slippage_ticks: 1
